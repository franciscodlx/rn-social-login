name: CI

# Pull requests only. main takes changes through merged pull requests alone
# (ruleset: PR required, these checks must pass), so the merged code already
# passed here; release.yml publishes it without running the suite again.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @franciscodlxdev/mock-idp test
      - run: pnpm --filter @franciscodlxdev/linkedin-backend-example test
      - run: pnpm --filter @franciscodlxdev/mercadolibre-backend-example test
      - run: pnpm --filter @franciscodlxdev/twitch-backend-example test
      - run: pnpm --filter @franciscodlxdev/presets-backend-example test
      - run: pnpm --filter @franciscodlxdev/telegram-backend-example test
      - run: pnpm --filter @franciscodlxdev/tiktok-backend-example test
      - run: pnpm --filter @franciscodlxdev/mock-entra test
      - run: pnpm build
      - name: Packages publish cleanly (dry run)
        run: node scripts/release.mjs --dry-run

  android:
    name: ${{ matrix.example }} (Android)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [auth-core-example, linkedin-login-example, x-login-example, mercadolibre-login-example, twitch-login-example, oauth-presets-example, telegram-login-example, tiktok-login-example, entra-native-auth-example]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          # Gradle distribution and plugins: fewer downloads that can fail mid-run.
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Build example
        working-directory: examples/${{ matrix.example }}/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
        # The Gradle plugin portal fails a resolution now and then
        # ("Plugin ... was not found"); one retry gets past it.
        run: |
          for attempt in 1 2; do
            ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a && exit 0
            echo "::warning::Gradle build failed (attempt $attempt)"
            sleep 20
          done
          exit 1

  ios:
    name: ${{ matrix.example.dir }} (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Hosted macOS runners are scarce (5 concurrent per account on the free
      # plan, shared by every repo): nine at once leave jobs unassigned until
      # GitHub gives up with "The job was not acquired by Runner".
      max-parallel: 3
      matrix:
        example:
          - { dir: auth-core-example, app: RnAuthCoreExample }
          - { dir: linkedin-login-example, app: LinkedInLoginExample }
          - { dir: x-login-example, app: XLoginExample }
          - { dir: mercadolibre-login-example, app: MercadoLibreLoginExample }
          - { dir: twitch-login-example, app: TwitchLoginExample }
          - { dir: oauth-presets-example, app: OAuthPresetsExample }
          - { dir: telegram-login-example, app: TelegramLoginExample }
          - { dir: tiktok-login-example, app: TikTokLoginExample }
          - { dir: entra-native-auth-example, app: EntraNativeAuthExample }
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prebuilt Hermes and React Native core tarballs (~30 MB each). Nine
      # parallel jobs downloading them from repo.reactnative.dev get their
      # connections reset now and then, so cache them and retry pod install.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ReactNative
          key: rn-prebuilt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install pods
        working-directory: examples/${{ matrix.example.dir }}
        run: |
          bundle install
          for attempt in 1 2 3; do
            bundle exec pod install --project-directory=ios && exit 0
            echo "::warning::pod install failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build example
        working-directory: examples/${{ matrix.example.dir }}/ios
        run: |
          xcodebuild -workspace ${{ matrix.example.app }}.xcworkspace -scheme ${{ matrix.example.app }} \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
