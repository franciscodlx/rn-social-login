name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @franciscodlx/mock-idp test
      - run: pnpm --filter @franciscodlx/linkedin-backend-example test
      - run: pnpm --filter @franciscodlx/mercadolibre-backend-example test
      - run: pnpm --filter @franciscodlx/twitch-backend-example test
      - run: pnpm --filter @franciscodlx/presets-backend-example test
      - run: pnpm --filter @franciscodlx/telegram-backend-example test
      - run: pnpm --filter @franciscodlx/tiktok-backend-example test
      - run: pnpm build

  android:
    name: ${{ matrix.example }} (Android)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [auth-core-example, linkedin-login-example, x-login-example, mercadolibre-login-example, twitch-login-example, oauth-presets-example, telegram-login-example, tiktok-login-example]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - name: Build example
        working-directory: examples/${{ matrix.example }}/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
        run: ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

  ios:
    name: ${{ matrix.example.dir }} (iOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - { dir: auth-core-example, app: RnAuthCoreExample }
          - { dir: linkedin-login-example, app: LinkedInLoginExample }
          - { dir: x-login-example, app: XLoginExample }
          - { dir: mercadolibre-login-example, app: MercadoLibreLoginExample }
          - { dir: twitch-login-example, app: TwitchLoginExample }
          - { dir: oauth-presets-example, app: OAuthPresetsExample }
          - { dir: telegram-login-example, app: TelegramLoginExample }
          - { dir: tiktok-login-example, app: TikTokLoginExample }
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pods
        working-directory: examples/${{ matrix.example.dir }}
        run: |
          bundle install
          bundle exec pod install --project-directory=ios
      - name: Build example
        working-directory: examples/${{ matrix.example.dir }}/ios
        run: |
          xcodebuild -workspace ${{ matrix.example.app }}.xcworkspace -scheme ${{ matrix.example.app }} \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
